[package]
name = "spacedatalab"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "SpaceDataLab's Rust entry point: the spacelab core, and every other spacelab crate behind a feature of its own"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["astrodynamics", "orbit", "satellite", "gnss", "space"]
categories = ["aerospace", "aerospace::simulation", "science"]
authors.workspace = true

[dependencies]
spacelab = "0.2"
# `std` for the CIO interpolator. The core is a std crate already, so turning it on costs nothing.
spacelab-frames = { version = "0.2", features = ["std"] }

spacelab-astro = { version = "0.2", optional = true }
spacelab-astrometry = { version = "0.2", optional = true }
spacelab-autodiff = { version = "0.2", optional = true }
spacelab-constellation = { version = "0.2", optional = true }
spacelab-control = { version = "0.2", optional = true }
spacelab-coverage = { version = "0.2", optional = true }
spacelab-earthvision = { version = "0.2", optional = true }
spacelab-elements = { version = "0.2", optional = true }
spacelab-ephemeris = { version = "0.2", optional = true }
spacelab-estimation = { version = "0.2", optional = true }
spacelab-geomagnetism = { version = "0.2", optional = true }
spacelab-geometry = { version = "0.2", optional = true }
spacelab-gnss = { version = "0.2", optional = true }
spacelab-grid = { version = "0.2", optional = true }
spacelab-ionosphere = { version = "0.2", optional = true }
spacelab-ndm = { version = "0.2", optional = true }
spacelab-propagation = { version = "0.2", optional = true }
spacelab-sensors = { version = "0.2", optional = true }
spacelab-signal = { version = "0.2", optional = true }
spacelab-slr = { version = "0.2", optional = true }
spacelab-vision = { version = "0.2", optional = true }

# One feature per crate, named after the module it adds. A crate whose default leaves `std` off gets
# it here: this crate is the whole API in one place, not a `no_std` build.
[features]
astro = ["dep:spacelab-astro"]
astrometry = ["dep:spacelab-astrometry"]
autodiff = ["dep:spacelab-autodiff"]
constellation = ["dep:spacelab-constellation", "spacelab-constellation/std"]
control = ["dep:spacelab-control"]
coverage = ["dep:spacelab-coverage", "spacelab-coverage/std"]
earthvision = ["dep:spacelab-earthvision"]
elements = ["dep:spacelab-elements"]
ephemeris = ["dep:spacelab-ephemeris"]
estimation = ["dep:spacelab-estimation"]
geomagnetism = ["dep:spacelab-geomagnetism"]
geometry = ["dep:spacelab-geometry"]
gnss = ["dep:spacelab-gnss"]
grid = ["dep:spacelab-grid"]
ionosphere = ["dep:spacelab-ionosphere"]
ndm = ["dep:spacelab-ndm"]
propagation = ["dep:spacelab-propagation"]
sensors = ["dep:spacelab-sensors"]
signal = ["dep:spacelab-signal"]
slr = ["dep:spacelab-slr"]
vision = ["dep:spacelab-vision"]
full = [
    "astro",
    "astrometry",
    "autodiff",
    "constellation",
    "control",
    "coverage",
    "earthvision",
    "elements",
    "ephemeris",
    "estimation",
    "geomagnetism",
    "geometry",
    "gnss",
    "grid",
    "ionosphere",
    "ndm",
    "propagation",
    "sensors",
    "signal",
    "slr",
    "vision",
]
# Cloud-mask inference through tract: off unless asked for, as it is in `spacelab-earthvision`.
onnx = ["earthvision", "spacelab-earthvision/onnx"]

[package.metadata.docs.rs]
features = ["full"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
